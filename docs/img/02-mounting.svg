<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1240" height="900" fill="#ffffff"/>
<text x="40" y="34" font-size="22" font-weight="bold" fill="#12202e">02 - rev B mounting section: 100 mm hole, 150 mm standoff, 75 deg cone</text>
<text x="40" y="56" font-size="12.5" fill="#6b7480">Tank measured, not guessed: 304.8 x 304.8 x 121.9 cm internal, full line 15.2 cm below the lid, 92 903 cm2 of area = 92.9 L per cm of level = 11 327 L to</text>
<text x="40" y="73" font-size="12.5" fill="#6b7480">the full line.</text>
<text x="40" y="90" font-size="12.5" fill="#6b7480">Every distance below is face to surface, which is exactly what the e and f calibration commands store.</text>
<polygon points="287.1,416.2 287.1,562.5 652.9,562.5 652.9,416.2Z" fill="none" stroke="#12202e" stroke-width="2" stroke-linejoin="round"/>
<rect x="287.12" y="562.5" width="365.76" height="14" fill="#c9d3de" stroke="#12202e" stroke-width="1.2" rx="4"/>
<text x="295.12" y="554.5" font-size="11.5" fill="#6b7480" text-anchor="start">tank floor</text>
<rect x="287.12" y="398.0" width="365.76" height="10" fill="#b9c4d0" stroke="#12202e" stroke-width="1.2" rx="4"/>
<text x="295.12" y="392.0" font-size="11.5" fill="#6b7480" text-anchor="start">lid</text>
<rect x="464.0" y="398.0" width="12.0" height="10" fill="#ffffff" stroke="#12202e" stroke-width="1.0" rx="4"/>
<line x1="458.0" y1="398.0" x2="458.0" y2="410" stroke="#20242a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="482.0" y1="398.0" x2="482.0" y2="410" stroke="#20242a" stroke-width="1.6" stroke-linecap="round"/>
<text x="510" y="390.0" font-size="11.5" fill="#12202e" text-anchor="start">100 mm hole, 150 mm</text>
<text x="510" y="404.5" font-size="11.5" fill="#12202e" text-anchor="start">stub pipe</text>
<polygon points="289.1,416.2 650.9,416.2 650.9,561.5 289.1,561.5Z" fill="#dceaf6" stroke="#12202e" stroke-width="0" stroke-linejoin="round"/>
<line x1="289.12" y1="416.2" x2="650.88" y2="416.2" stroke="#2a7fbf" stroke-width="2.2" stroke-linecap="round"/>
<text x="297.12" y="438.2" font-size="12" fill="#1d5f92" font-weight="bold" text-anchor="start">water surface: the reflector</text>
<rect x="455" y="380" width="30" height="16" fill="#cde6cd" stroke="#0a7d3c" stroke-width="1.8" rx="4"/>
<text x="470" y="368" font-size="12" fill="#0a7d3c" font-weight="bold" text-anchor="middle">SR04M probe face, straight down</text>
<polygon points="470.0,380.0 442.2,416.2 497.8,416.2Z" fill="#cfe2f2" stroke="#0b5cad" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text x="511.7654" y="438.2" font-size="11.5" fill="#0b5cad" text-anchor="start">beam 46 cm wide at the full line</text>
<polygon points="470.0,380.0 330.0,562.5 610.0,562.5Z" fill="none" stroke="#6b7480" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="6 4"/>
<text x="330.02250000000004" y="588.5" font-size="11.5" fill="#6b7480" text-anchor="start">beam 233 cm wide at an empty floor, still</text>
<text x="330.02250000000004" y="603.0" font-size="11.5" fill="#6b7480" text-anchor="start">inside the 304.8 cm tank</text>
<rect x="439" y="380" width="62" height="24" fill="#f6dede" stroke="#8c1c13" stroke-width="1.2" rx="4" stroke-dasharray="4 3"/>
<text x="428" y="388.0" font-size="11.5" fill="#8c1c13" text-anchor="end">blind 20 cm</text>
<text x="428" y="402.0" font-size="11.5" fill="#8c1c13" text-anchor="end">gate 25 cm</text>
<line x1="720" y1="380" x2="720" y2="416.2" stroke="#0a7d3c" stroke-width="1.3" stroke-linecap="round"/>
<line x1="714" y1="380" x2="726" y2="380" stroke="#0a7d3c" stroke-width="1.3" stroke-linecap="round"/>
<line x1="714" y1="416.2" x2="726" y2="416.2" stroke="#0a7d3c" stroke-width="1.3" stroke-linecap="round"/>
<text x="728" y="394.1" font-size="11.5" fill="#0a7d3c" font-weight="bold" text-anchor="start">30.2 cm</text>
<text x="728" y="408.1" font-size="11.5" fill="#0a7d3c" text-anchor="start">face to full line</text>
<line x1="860" y1="380" x2="860" y2="562.5" stroke="#0b5cad" stroke-width="1.3" stroke-linecap="round"/>
<line x1="854" y1="380" x2="866" y2="380" stroke="#0b5cad" stroke-width="1.3" stroke-linecap="round"/>
<line x1="854" y1="562.5" x2="866" y2="562.5" stroke="#0b5cad" stroke-width="1.3" stroke-linecap="round"/>
<text x="868" y="467.25" font-size="11.5" fill="#0b5cad" font-weight="bold" text-anchor="start">152.1 cm</text>
<text x="868" y="481.25" font-size="11.5" fill="#0b5cad" text-anchor="start">face to empty floor</text>
<line x1="1015" y1="416.2" x2="1015" y2="562.5" stroke="#12202e" stroke-width="1.3" stroke-linecap="round"/>
<line x1="1009" y1="416.2" x2="1021" y2="416.2" stroke="#12202e" stroke-width="1.3" stroke-linecap="round"/>
<line x1="1009" y1="562.5" x2="1021" y2="562.5" stroke="#12202e" stroke-width="1.3" stroke-linecap="round"/>
<text x="1023" y="485.35" font-size="11.5" fill="#12202e" font-weight="bold" text-anchor="start">121.9 cm</text>
<text x="1023" y="499.35" font-size="11.5" fill="#12202e" text-anchor="start">span = level 100 %</text>
<line x1="240.12" y1="380" x2="240.12" y2="398.0" stroke="#12202e" stroke-width="1.3" stroke-linecap="round"/>
<line x1="234.12" y1="380" x2="246.12" y2="380" stroke="#12202e" stroke-width="1.3" stroke-linecap="round"/>
<line x1="234.12" y1="398.0" x2="246.12" y2="398.0" stroke="#12202e" stroke-width="1.3" stroke-linecap="round"/>
<text x="232.12" y="376.0" font-size="11.5" fill="#12202e" font-weight="bold" text-anchor="end">15.0 cm</text>
<text x="232.12" y="390.0" font-size="11.5" fill="#12202e" text-anchor="end">face above lid</text>
<line x1="180.12" y1="398.0" x2="180.12" y2="416.2" stroke="#12202e" stroke-width="1.3" stroke-linecap="round"/>
<line x1="174.12" y1="398.0" x2="186.12" y2="398.0" stroke="#12202e" stroke-width="1.3" stroke-linecap="round"/>
<line x1="174.12" y1="416.2" x2="186.12" y2="416.2" stroke="#12202e" stroke-width="1.3" stroke-linecap="round"/>
<text x="172.12" y="433.1" font-size="11.5" fill="#12202e" font-weight="bold" text-anchor="end">15.2 cm</text>
<text x="172.12" y="447.1" font-size="11.5" fill="#12202e" text-anchor="end">lid to full line</text>
<rect x="40" y="284" width="200" height="78" fill="#f4f8fb" stroke="#12202e" stroke-width="1.5" rx="4"/>
<text x="52" y="306.0" font-size="12.5" fill="#12202e" font-weight="bold" text-anchor="start">electronics box</text>
<text x="52" y="324" font-size="11" fill="#6b7480" text-anchor="start">ESP32, OLED, buzzer,</text>
<text x="52" y="340" font-size="11" fill="#6b7480" text-anchor="start">boost, button, LED</text>
<text x="52" y="356" font-size="11" fill="#0b5cad" text-anchor="start">4-wire cable down the stub</text>
<polygon points="380.0,354.0 560.0,354.0 540.0,330.0 400.0,330.0Z" fill="#fbf1de" stroke="#c28000" stroke-width="1.6" stroke-linejoin="round"/>
<text x="470" y="318" font-size="12" fill="#8c1c13" font-weight="bold" text-anchor="middle">cowl: sun, rain, insects. NEVER a screen across the</text>
<text x="470" y="333" font-size="12" fill="#8c1c13" font-weight="bold" text-anchor="middle">aperture: 40 kHz will not pass a mesh.</text>
<rect x="40" y="660" width="560" height="218.5" fill="#fdf6f4" stroke="#8c1c13" stroke-width="1.6" rx="6"/>
<text x="54" y="684" font-size="14" fill="#8c1c13" font-weight="bold" text-anchor="start">Why 100 mm and 150 mm</text>
<text x="54" y="706.0" font-size="12.5" fill="#12202e" text-anchor="start">Full line 30.2 cm below the face: 5.2 cm of headroom over the 25 cm</text>
<text x="54" y="724.5" font-size="12.5" fill="#12202e" text-anchor="start">gate. That headroom covers swell, splash and a film on the face; it</text>
<text x="54" y="743.0" font-size="12.5" fill="#12202e" text-anchor="start">does not cover an overfilled tank.</text>
<text x="54" y="761.5" font-size="12.5" fill="#12202e" text-anchor="start">Above 30.2 cm the reading is reported FULL and clamps at 121.9 cm: a</text>
<text x="54" y="780.0" font-size="12.5" fill="#12202e" text-anchor="start">report, not an interlock.</text>
<text x="54" y="798.5" font-size="12.5" fill="#12202e" text-anchor="start">A narrow pipe, collar or cowl lip close above the cone turns the lid</text>
<text x="54" y="817.0" font-size="12.5" fill="#12202e" text-anchor="start">into a resonant clutter chamber. Keep the aperture clear and wide.</text>
<text x="54" y="835.5" font-size="12.5" fill="#12202e" text-anchor="start">Lid clutter reflects at 15-19 cm, inside the 20 cm blind area, so it</text>
<text x="54" y="854.0" font-size="12.5" fill="#12202e" text-anchor="start">cannot reach the beam.</text>
<rect x="640" y="660" width="560" height="181.5" fill="#fdf6f4" stroke="#8c1c13" stroke-width="1.6" rx="6"/>
<text x="654" y="684" font-size="14" fill="#8c1c13" font-weight="bold" text-anchor="start">On the tank</text>
<text x="654" y="706.0" font-size="12.5" fill="#12202e" text-anchor="start">Face parallel to the water within a few degrees: the cone must put a</text>
<text x="654" y="724.5" font-size="12.5" fill="#12202e" text-anchor="start">return on the transducer, not on the far wall.</text>
<text x="654" y="743.0" font-size="12.5" fill="#12202e" text-anchor="start">Wipe the face at every site visit - dust and cobwebs bias it near,</text>
<text x="654" y="761.5" font-size="12.5" fill="#12202e" text-anchor="start">dew rejects the ping.</text>
<text x="654" y="780.0" font-size="12.5" fill="#12202e" text-anchor="start">Check pad R19 unpopulated before sealing the box.</text>
<text x="654" y="798.5" font-size="12.5" fill="#12202e" text-anchor="start">Probe cable serviceable: the probe must come out without draining the</text>
<text x="654" y="817.0" font-size="12.5" fill="#12202e" text-anchor="start">tank.</text>
</svg>
