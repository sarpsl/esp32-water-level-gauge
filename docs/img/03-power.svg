<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1240" height="980" fill="#ffffff"/>
<text x="40" y="34" font-size="22" font-weight="bold" fill="#12202e">03 - rev B power: panel, 1S Li-ion MPPT charge, boost, load</text>
<text x="40" y="56" font-size="12.5" fill="#6b7480">Everything runs on the 5 V boost rail: ESP32, OLED, piezo buzzer and the SR04M-family module. There is no 12 V box and no battery sense at the pack unless</text>
<text x="40" y="73" font-size="12.5" fill="#6b7480">you add the second divider documented in 00-design.md.</text>
<rect x="40" y="150" width="170" height="96" fill="#f4f8fb" stroke="#12202e" stroke-width="1.6" rx="6"/>
<text x="52" y="174" font-size="13" fill="#12202e" font-weight="bold" text-anchor="start">5 W / 6 V panel</text>
<text x="52" y="192" font-size="11" fill="#6b7480" text-anchor="start">open circuit ~7 V</text>
<text x="52" y="208" font-size="11" fill="#6b7480" text-anchor="start">short circuit ~0.95 A</text>
<text x="52" y="224" font-size="11" fill="#6b7480" text-anchor="start">250-300 mA in sun</text>
