<text x="280" y="266.0" font-size="11.5" fill="#b00020" font-weight="bold" text-anchor="middle">1 A polyfuse</text>
<text x="280" y="296.0" font-size="10.5" fill="#6b7480" text-anchor="middle">panel short-circuit path</text>
<rect x="340" y="130" width="190" height="150" fill="#f4f8fb" stroke="#12202e" stroke-width="1.6" rx="6"/>
<text x="352" y="154" font-size="13" fill="#12202e" font-weight="bold" text-anchor="start">CN3791 MPPT</text>
<text x="352" y="172" font-size="11" fill="#6b7480" text-anchor="start">CV set to 4.20 V, 1S</text>
<text x="352" y="188" font-size="11" fill="#6b7480" text-anchor="start">CC set by Rs, ~1 A</text>
<text x="352" y="204" font-size="11" fill="#6b7480" text-anchor="start">12 V panel OK</text>
<text x="352" y="220" font-size="11" fill="#6b7480" text-anchor="start">TEMP pin: stop under 0 C</text>
<text x="352" y="236" font-size="11" fill="#6b7480" text-anchor="start">red charge, green full</text>
<line x1="315" y1="178" x2="340" y2="178" stroke="#b00020" stroke-width="1.6" stroke-linecap="round"/>
<line x1="530" y1="178" x2="570" y2="178" stroke="#b00020" stroke-width="1.6" stroke-linecap="round"/>
<rect x="525.75" y="159" width="48.5" height="22" fill="#ffffff" stroke="#b00020" stroke-width="1.4" rx="4"/>
<text x="550" y="174.0" font-size="11.5" fill="#b00020" font-weight="bold" text-anchor="middle">0.5 A</text>
<rect x="570" y="130" width="200" height="150" fill="#f4f8fb" stroke="#b00020" stroke-width="1.6" rx="6"/>
<text x="582" y="154" font-size="13" fill="#12202e" font-weight="bold" text-anchor="start">18650 x2 parallel</text>
<text x="582" y="172" font-size="11" fill="#6b7480" text-anchor="start">protected cells only</text>
<text x="582" y="188" font-size="11" fill="#6b7480" text-anchor="start">4.2 V top, 2.8 V cut</text>
<text x="582" y="204" font-size="11" fill="#6b7480" text-anchor="start">true capacity 1.2-3.5 Ah</text>
<text x="582" y="220" font-size="11" fill="#6b7480" text-anchor="start">never mismatched</text>
<text x="582" y="236" font-size="11" fill="#6b7480" text-anchor="start">check with a multimeter</text>
<line x1="670" y1="280" x2="670" y2="300" stroke="#20242a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="670" y1="300" x2="670" y2="312" stroke="#20242a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="659" y1="312" x2="681" y2="312" stroke="#20242a" stroke-width="2" stroke-linecap="round"/>
<line x1="663" y1="316" x2="677" y2="316" stroke="#20242a" stroke-width="2" stroke-linecap="round"/>
<line x1="667" y1="320" x2="673" y2="320" stroke="#20242a" stroke-width="2" stroke-linecap="round"/>
<text x="685" y="316.0" font-size="10.5" fill="#6b7480" text-anchor="start">pack -</text>
<text x="700" y="300" font-size="11" fill="#6b7480" text-anchor="start">1 M / 1 M sense to GPIO36</text>
<rect x="830" y="130" width="190" height="150" fill="#f4f8fb" stroke="#b00020" stroke-width="1.6" rx="6"/>
<text x="842" y="154" font-size="13" fill="#12202e" font-weight="bold" text-anchor="start">MT3608 boost</text>
<text x="842" y="172" font-size="11" fill="#6b7480" text-anchor="start">to 5.0 V, trim with the</text>
<text x="842" y="188" font-size="11" fill="#6b7480" text-anchor="start">25 k trimpot</text>
<text x="842" y="204" font-size="11" fill="#6b7480" text-anchor="start">no soft start</text>
<text x="842" y="220" font-size="11" fill="#6b7480" text-anchor="start">input spikes brown out</text>
<text x="842" y="236" font-size="11" fill="#6b7480" text-anchor="start">the ESP32 under Wi-Fi TX</text>
<line x1="770" y1="178" x2="830" y2="178" stroke="#b00020" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1020" y1="178" x2="1180" y2="178" stroke="#b00020" stroke-width="2" stroke-linecap="round"/>
<rect x="1111.95" y="137" width="76.1" height="22" fill="#ffffff" stroke="#b00020" stroke-width="1.4" rx="4"/>
<text x="1150" y="152.0" font-size="11.5" fill="#b00020" font-weight="bold" text-anchor="middle">+5 V rail</text>
<line x1="1150" y1="159" x2="1150" y2="178" stroke="#b00020" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1050" y1="178" x2="1050" y2="192" stroke="#b00020" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1039" y1="192" x2="1061" y2="192" stroke="#b00020" stroke-width="2" stroke-linecap="round"/>
<line x1="1042" y1="197" x2="1058" y2="197" stroke="#b00020" stroke-width="2" stroke-linecap="round"/>
<line x1="1050" y1="197" x2="1050" y2="208" stroke="#b00020" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1050" y1="208" x2="1050" y2="220" stroke="#20242a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1039" y1="220" x2="1061" y2="220" stroke="#20242a" stroke-width="2" stroke-linecap="round"/>
<line x1="1043" y1="224" x2="1057" y2="224" stroke="#20242a" stroke-width="2" stroke-linecap="round"/>
<line x1="1047" y1="228" x2="1053" y2="228" stroke="#20242a" stroke-width="2" stroke-linecap="round"/>
<text x="1065" y="194" font-size="11" fill="#b00020" text-anchor="start">100 nF</text>
<line x1="1120" y1="178" x2="1120" y2="192" stroke="#b00020" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1109" y1="192" x2="1131" y2="192" stroke="#b00020" stroke-width="2" stroke-linecap="round"/>
<line x1="1112" y1="197" x2="1128" y2="197" stroke="#b00020" stroke-width="2" stroke-linecap="round"/>
<line x1="1120" y1="197" x2="1120" y2="208" stroke="#b00020" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1120" y1="208" x2="1120" y2="220" stroke="#20242a" stroke-width="1.6" stroke-linecap="round"/>
<line x1="1109" y1="220" x2="1131" y2="220" stroke="#20242a" stroke-width="2" stroke-linecap="round"/>
<line x1="1113" y1="224" x2="1127" y2="224" stroke="#20242a" stroke-width="2" stroke-linecap="round"/>
<line x1="1117" y1="228" x2="1123" y2="228" stroke="#20242a" stroke-width="2" stroke-linecap="round"/>
<text x="1135" y="194" font-size="11" fill="#b00020" text-anchor="start">470 uF</text>
<rect x="1040" y="300" width="160" height="150" fill="#f4f8fb" stroke="#0b5cad" stroke-width="1.6" rx="6"/>
<text x="1052" y="324" font-size="13" fill="#12202e" font-weight="bold" text-anchor="start">the load</text>
<text x="1052" y="342" font-size="11" fill="#6b7480" text-anchor="start">ESP32 + OLED</text>
<text x="1052" y="358" font-size="11" fill="#6b7480" text-anchor="start">+ SR04M module</text>
<text x="1052" y="374" font-size="11" fill="#6b7480" text-anchor="start">+ piezo buzzer</text>
<text x="1052" y="390" font-size="11" fill="#6b7480" text-anchor="start">+ button, LED</text>
<text x="1052" y="406" font-size="11" fill="#6b7480" text-anchor="start">the 5.0 V rail</text>
<text x="1036" y="170" font-size="11" fill="#6b7480" text-anchor="start">cap at the load</text>
<line x1="1180" y1="178" x2="1180" y2="300" stroke="#b00020" stroke-width="1.6" stroke-linecap="round"/>
<rect x="40" y="360" width="380" height="150" fill="#f2f6f2" stroke="#0a7d3c" stroke-width="1.6" rx="6"/>
<text x="54" y="386" font-size="13" fill="#0a7d3c" font-weight="bold" text-anchor="start">bench: never lithium without a current limit</text>
<text x="54" y="410.0" font-size="11.5" fill="#12202e" text-anchor="start">USB-C into the DevKit is fine for firmware work,</text>
<text x="54" y="424.5" font-size="11.5" fill="#12202e" text-anchor="start">but the CP2102 port cannot feed the boost rail:</text>
<text x="54" y="439.0" font-size="11.5" fill="#12202e" text-anchor="start">the module and buzzer brown the board out.</text>
<text x="54" y="462.0" font-size="11.5" fill="#12202e" text-anchor="start">Bench power = lab supply, 4.2 V, current limit 500</text>
<text x="54" y="476.5" font-size="11.5" fill="#12202e" text-anchor="start">mA, into the boost input or the battery pads.</text>
<text x="54" y="500.0" font-size="11.5" fill="#8c1c13" text-anchor="start">A TP4056 module (no protection) is a bench charger</text>
<text x="54" y="514.5" font-size="11.5" fill="#8c1c13" text-anchor="start">only, never in the box.</text>
<rect x="40" y="540" width="560" height="34" fill="#eef4fa" stroke="#12202e" stroke-width="1.4" rx="6"/>
<text x="54" y="562.0" font-size="13.5" fill="#12202e" font-weight="bold" text-anchor="start">Measured and expected budget</text>
<text x="40" y="590.0" font-size="11.5" fill="#6b7480" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="start">state</text>
<text x="230" y="590.0" font-size="11.5" fill="#12202e" text-anchor="start">draw</text>
<text x="370" y="590.0" font-size="11.5" fill="#12202e" text-anchor="start">where it comes from</text>
<text x="40" y="608.0" font-size="11.5" fill="#6b7480" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="start">WiFi on, modem sleep</text>
<text x="230" y="608.0" font-size="11.5" fill="#12202e" text-anchor="start">20-25 mA</text>
<text x="370" y="608.0" font-size="11.5" fill="#12202e" text-anchor="start">the working point, 30 s reads</text>
<text x="40" y="626.0" font-size="11.5" fill="#6b7480" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="start">modem sleep off, OLED lit</text>
<text x="230" y="626.0" font-size="11.5" fill="#12202e" text-anchor="start">60-95 mA</text>
<text x="370" y="626.0" font-size="11.5" fill="#12202e" text-anchor="start">what the idle blanking avoids</text>
<text x="40" y="644.0" font-size="11.5" fill="#6b7480" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="start">light sleep between reads</text>
<text x="230" y="644.0" font-size="11.5" fill="#12202e" text-anchor="start">4-8 mA</text>
<text x="370" y="644.0" font-size="11.5" fill="#12202e" text-anchor="start">phase-2 board, not a DevKitC</text>
<text x="40" y="662.0" font-size="11.5" fill="#6b7480" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="start">SR04M while pinging</text>
<text x="230" y="662.0" font-size="11.5" fill="#12202e" text-anchor="start">< 8 mA</text>
<text x="370" y="662.0" font-size="11.5" fill="#12202e" text-anchor="start">module spec, on top of the ESP32</text>
<text x="40" y="680.0" font-size="11.5" fill="#6b7480" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="start">WiFi TX burst</text>
<text x="230" y="680.0" font-size="11.5" fill="#12202e" text-anchor="start">~350 mA peak</text>
<text x="370" y="680.0" font-size="11.5" fill="#12202e" text-anchor="start">why the bulk cap matters</text>
<text x="40" y="698.0" font-size="11.5" fill="#6b7480" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="start">buzzer beat</text>
<text x="230" y="698.0" font-size="11.5" fill="#12202e" text-anchor="start">+30 mA</text>
<text x="370" y="698.0" font-size="11.5" fill="#12202e" text-anchor="start">bench, HC-SR04 rehearsal</text>
<text x="40" y="716.0" font-size="11.5" fill="#6b7480" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="start">panel into 6 Ah</text>
<text x="230" y="716.0" font-size="11.5" fill="#12202e" text-anchor="start">~1.5-3 h</text>
<text x="370" y="716.0" font-size="11.5" fill="#12202e" text-anchor="start">5 W in real sun, MPPT</text>
<text x="40" y="734.0" font-size="11.5" fill="#6b7480" font-family="DejaVu Sans Mono, Consolas, monospace" text-anchor="start">autonomy at 22 mA</text>
<text x="230" y="734.0" font-size="11.5" fill="#12202e" text-anchor="start">11-12 d</text>
<text x="370" y="734.0" font-size="11.5" fill="#12202e" text-anchor="start">6 Ah pack, panel doing nothing</text>
<text x="40" y="778.0" font-size="11.5" fill="#6b7480" text-anchor="start">The 24 h column test in 02-phase0-test-plan.md is what turns these targets</text>
<text x="40" y="792.5" font-size="11.5" fill="#6b7480" text-anchor="start">into numbers.</text>
<rect x="640" y="540" width="560" height="292.5" fill="#fdf6f4" stroke="#8c1c13" stroke-width="1.6" rx="6"/>
<text x="654" y="564" font-size="14" fill="#8c1c13" font-weight="bold" text-anchor="start">Why the power supply is a sensor problem</text>
<text x="654" y="586.0" font-size="12.5" fill="#12202e" text-anchor="start">Boost converters have no soft start and no undervoltage lockout worth</text>
<text x="654" y="604.5" font-size="12.5" fill="#12202e" text-anchor="start">the name: an empty pack plus a Wi-Fi TX burst is the classic 'it</text>
<text x="654" y="623.0" font-size="12.5" fill="#12202e" text-anchor="start">boots then dies' fault.</text>
<text x="654" y="641.5" font-size="12.5" fill="#12202e" text-anchor="start">The module's transmit burst is acoustic but its current step is</text>
<text x="654" y="660.0" font-size="12.5" fill="#12202e" text-anchor="start">electrical: keep the 100 nF and 100 uF at its own pins, away from the</text>
<text x="654" y="678.5" font-size="12.5" fill="#12202e" text-anchor="start">ESP32's.</text>
<text x="654" y="697.0" font-size="12.5" fill="#12202e" text-anchor="start">Li-ion cells that are not genuinely protected, or two cells of</text>
<text x="654" y="715.5" font-size="12.5" fill="#12202e" text-anchor="start">different age or brand, are a fire risk and a mystery bug generator.</text>
<text x="654" y="734.0" font-size="12.5" fill="#12202e" text-anchor="start">470 uF on the 5 V rail is not decoration: it is what keeps the SR04M</text>
<text x="654" y="752.5" font-size="12.5" fill="#12202e" text-anchor="start">echo timing valid during a TX burst.</text>
<text x="654" y="771.0" font-size="12.5" fill="#12202e" text-anchor="start">00-design.md keeps a high-side load switch (TPS22919) on the module's</text>
<text x="654" y="789.5" font-size="12.5" fill="#12202e" text-anchor="start">5 V rail on the phase-1 PCB, to kill its 2 mA standby between reads.</text>
<text x="654" y="808.0" font-size="12.5" fill="#12202e" text-anchor="start">The bench build hard-wires it.</text>
</svg>
