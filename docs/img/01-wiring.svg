<text x="52" y="576" font-size="11" fill="#6b7480" text-anchor="start">face 150 mm above the lid</text>
<text x="52" y="600" font-size="11" fill="#8c1c13" font-weight="bold" text-anchor="start">no mesh, no screen over it</text>
