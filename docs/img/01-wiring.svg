  .stubU{stroke:#0b7d3f;stroke-width:2.4}
  .stubN{stroke:#c8ccd2;stroke-width:1.4}
  .stubX{stroke:#c0392b;stroke-width:1.6}
 </style>
</defs>
<rect width="1420" height="1060" fill="#fff"/>
<text x="34" y="40" class="ttl">Phase 0 wiring map — ESP32-WROOM-32 DevKitC V1 (38-pin, CP2102)</text>
<text x="34" y="62" class="sub">Green pins = used by the sketch. Grey = present but unused. Red = NEVER wire. Nets are matched by name: each module box lists the net it needs.</text>
<text x="34" y="82" class="sub">Optional local alarm parts (OLED, piezo, button) are drawn too. Blynk / the phone app adds NO wiring at all — it is the same board.</text>

