  .pinN{font-size:12px;font-family:DejaVu Sans Mono,monospace;fill:#9aa0a6}
  .pinX{font-size:12px;font-family:DejaVu Sans Mono,monospace;font-weight:700;fill:#c0392b}
  .net{font-size:11.5px;font-family:DejaVu Sans Mono,monospace;font-weight:700;fill:#0b5cad}
