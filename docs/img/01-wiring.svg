<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1240" height="1080" fill="#ffffff"/>
<text x="40" y="34" font-size="22" font-weight="bold" fill="#12202e">01 - rev B bench wiring: ESP32 + SR04M-family ultrasonic gauge</text>
<text x="40" y="56" font-size="12.5" fill="#6b7480">SR04M / SR04M-2 / AJ-SR04M / JSN-SR04M-2. Mode 1 (HC-SR04-compatible TRIG/ECHO) is the only mode the firmware speaks: pad R19 must stay unpopulated.</text>
<text x="40" y="73" font-size="12.5" fill="#6b7480">GPIO numbers are ESP32-WROOM-32 numbers, matching the reference project iotcircuithub.com/iot-based-water-level-indicator . The pin columns are a signal</text>
<text x="40" y="90" font-size="12.5" fill="#6b7480">map, not the physical pin order. Nothing here switches a pump or a valve.</text>
