<rect x="40" y="810" width="1160" height="255.5" fill="#fdf6f4" stroke="#8c1c13" stroke-width="1.6" rx="6"/>
<text x="54" y="834" font-size="14" fill="#8c1c13" font-weight="bold" text-anchor="start">Read before wiring</text>
<text x="54" y="856.0" font-size="12.5" fill="#12202e" text-anchor="start">ECHO goes through 2 k in series and 3.3 k to GND, node 3.00 V. Power the module from 3V3 instead and you can delete both resistors, but you give up</text>
<text x="54" y="874.5" font-size="12.5" fill="#12202e" text-anchor="start">acoustic margin.</text>
<text x="54" y="893.0" font-size="12.5" fill="#12202e" text-anchor="start">GPIO 6-11 (silkscreen D6..D11) are the SPI flash lines: they look usable and are not.</text>
<text x="54" y="911.5" font-size="12.5" fill="#12202e" text-anchor="start">Mode 1 needs pad R19 unpopulated. A fitted resistor puts the module in a serial mode that never answers a TRIG pulse.</text>
<text x="54" y="930.0" font-size="12.5" fill="#12202e" text-anchor="start">Button: internal pull-up, idle HIGH, pressed GND. GPIO12 is a strapping pin, so never hold it through a reset - GPIO23 is the safe alternative, one</text>
<text x="54" y="948.5" font-size="12.5" fill="#12202e" text-anchor="start">line in the sketch (PIN_BTN).</text>
<text x="54" y="967.0" font-size="12.5" fill="#12202e" text-anchor="start">Buzzer: tone() at 1.8 kHz for low level, 2.6 kHz for high or fault, 250 ms every 9 s, driven by the NPN from GPIO13 with a 220 base resistor and a</text>
<text x="54" y="985.5" font-size="12.5" fill="#12202e" text-anchor="start">diode across the buzzer.</text>
<text x="54" y="1004.0" font-size="12.5" fill="#12202e" text-anchor="start">LED on GPIO14: heartbeat every 1.5 s, solid on when the tank is full.</text>
<text x="54" y="1022.5" font-size="12.5" fill="#12202e" text-anchor="start">Never screen the aperture - a flyscreen blocks 40 kHz entirely. Use the cowl.</text>
<text x="54" y="1041.0" font-size="12.5" fill="#12202e" text-anchor="start">This gauge reports. It must never be wired to switch a pump, valve or load.</text>
</svg>
